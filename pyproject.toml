[project]
name = "au-tax"
version = "0.3.0"
license = "MIT"
description = "Deterministic Australian tax calculators backing the au-accounting plugin"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
]

[project.scripts]
au-tax = "au_tax.cli:main"
au-tax-mcp = "au_tax.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/au_tax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
