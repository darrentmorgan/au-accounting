# Law-change watch list. Read by scripts/law_watch.py; fingerprints live in fingerprints.json beside this file.
# Run: uv run scripts/law_watch.py check   (see docs/law-watch.md)
#
# What is on the list (primary sources only, CONVENTIONS section 1):
#   - ATO rates and codes pages, and ATO guidance pages that source two or more figure keys in
#     data/rates/2026-27*.yaml or 2027-28*.yaml (keys, skills and any null or SUSPECT figures are in `why`);
#   - ATO new-legislation pages for announced changes, and the registered-agent lodgment pages;
#   - the latest compilation of each Act and Regulations cited in skills/*/references/sources.md
#     (legislation.gov.au /latest/ pages; the fingerprint is the compilation id and effective date);
#   - RevenueSA and SA legislation pages behind state-taxes-sa; ASIC fees; the Fair Work Commission minimum wage;
#   - public-holiday pages behind data/holidays/au.yaml (Fair Work Ombudsman, SA, and the pages that carry the
#     unresolved WA and VIC 2028 dates).
# Left off: as-made Acts and PDFs (they never change), AustLII mirrors, ATO legal-database pages (rulings and print
# views, which render by script), single-figure ATO pages whose figure is fixed by legislation, and other states'
# revenue offices.
#
# Extraction hints were tuned against real pages on 2026-09-29: legislation.gov.au, asic.gov.au, wa.gov.au and
# abs.gov.au fetched by the script; one ato.gov.au page and one fairwork.gov.au page fetched once outside it (the
# script itself is refused or times out there). The `generic` profile (whole body) is a placeholder for RevenueSA,
# legislation.sa.gov.au, safework.sa.gov.au, business.vic.gov.au, fwc.gov.au and the ATO software-developer page,
# which refused or did not answer: tune them from a saved copy (docs/law-watch.md) before relying on them.
#
# Fields: id (kebab-case, unique), url (https), profile (shared extraction hints below), why (which figure keys or
# skills depend on the page), skills, extract (per-page overrides of the profile).
# Extraction hints (all optional):
#   select        one compound selector for the region to fingerprint: tag, #id, .class, [attr], [attr^=v], [attr*=v]
#   exclude       selectors of regions inside it to drop (breadcrumbs, feedback widgets)
#   start / end   text anchors that trim the extracted text
#   strip         regexes removed from each text block (changing boilerplate such as "Last updated" lines)
#   meta          name: regex over the raw HTML; captured values are stored and shown when they move
#   fingerprint   {mode: text} (default) or {mode: meta, keys: [...]} to hash only those meta values
#   min_chars     fewer extracted characters than this is reported as `error: blocked` (empty or script-rendered page)
#   expect        strings that must appear in the extracted text, else `error: blocked`
#   http_last_modified   also store the HTTP Last-Modified header in meta (only where the site keeps it stable)
# ATO pages, RevenueSA and legislation.sa.gov.au can answer scripted requests with a bot challenge or an empty
# shell. law_watch reports those as `error: blocked` and never works around them: check such pages by hand.
schema: 1
profiles:
  ato:
    select: "section#content"
    exclude: ["#breadcrumb-nav", "#content-nav", "#page-qc", "#page-print"]
    strip: ['^Last updated\b.*$']
    meta:
      last_updated: '<strong>Last updated\s*</strong>\s*([^<]+)<'
  legislation-gov-au:
    fingerprint: {mode: meta, keys: [compilation_id, effective_start]}
    meta:
      compilation_id: 'class="item-id[^"]*">\s*([A-Z]\d{4}[A-Z]\d{5})'
      compilation_no: 'class="item-id[^"]*">\s*[A-Z]\d{4}[A-Z]\d{5}\s+(\w+)'
      effective_start: 'date-effective-start">([^<]+)<'
      publish_comments: '"isLatest":true[^{}]*?"publishComments":"((?:[^"\\]|\\.)*)"'
  fwo:
    select: "article.main"
    strip: ['^Content last updated.*$', '^Printed from .*$']
    meta:
      last_updated: 'Content last updated:\s*(\d{4}-\d{2}-\d{2})'
  asic:
    select: "main"
    meta:
      last_modified: 'name="dcterms.date.modified" content="([^"]+)"'
  wa-gov:
    select: "article[class*=node--view-mode-full]"
    strip: ['^Last updated\b.*$']
    meta:
      last_updated: 'ast updated: <time[^>]*>([^<]+)<'
  abs:
    select: "main"
    meta:
      release_date: 'elease date and time</div><div class="field__item">([^<]+)<'
  generic: {}
