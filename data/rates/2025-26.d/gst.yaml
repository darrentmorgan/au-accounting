# gst-bas overlay, income year 2025-26. Same schema as the base file; no key collisions. Read on primary pages 29 Sep 2026.
gst:
  simpler_bas_turnover_max:
    value: 10000000
    unit: AUD
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/lodging-your-bas-or-annual-gst-return/options-for-reporting-and-paying-gst/quarterly-gst-reporting
    as_at: 2026-09-29
    notes: 'GST turnover below this: Simpler BAS (G1, 1A, 1B only) unless on GST instalments; at or above: full reporting (G1, G2, G3, G10, G11, 1A, 1B). ATO page updated 14 Sep 2026.'
  registration_deadline_days:
    value: 21
    unit: days
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/registering-for-gst
    as_at: 2026-09-29
    notes: 'Register within 21 days of GST turnover reaching the threshold (ATO page updated 14 Sep 2026).'
  tax_invoice_buyer_identity_threshold:
    value: 1000
    unit: AUD
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/tax-invoices
    as_at: 2026-09-29
    notes: 'Tax invoices for taxable sales of $1,000 or more must also show the buyer identity or ABN (ATO page updated 18 Sep 2026; GST Regulations 2019 reg 29-70.01).'
  financial_acquisitions_threshold_amount:
    value: 150000
    unit: AUD
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19990055/189-5&PiT=99991231235958
    as_at: 2026-09-29
    notes: 's189-5(1)(a): input tax credits on financial acquisitions over 12 months above this exceed the financial acquisitions threshold.'
  financial_acquisitions_threshold_share:
    value: 0.1
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19990055/189-5&PiT=99991231235958
    as_at: 2026-09-29
    notes: 's189-5(1)(b): or more than 10% of total input tax credits for all acquisitions in the 12 months.'
  div87_value_share:
    value: 0.5
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19990055/87-5&PiT=99991231235958
    as_at: 2026-09-29
    notes: 's87-5(1): value of long-term commercial accommodation in premises predominantly for long-term accommodation is 50% of the price that would otherwise apply (GSTR 2012/7 para 28).'
  settlement_withholding_margin_scheme_rate:
    value: 0.07
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19530001/Sch1-14-250&PiT=99991231235958
    as_at: 2026-09-29
    notes: 'TAA 1953 Sch 1 s14-250(6)(a)(ii): 7% of the contract price where the margin scheme applies (no ministerial determination seen; ATO margin scheme example also uses 7%).'
  settlement_withholding_standard_fraction:
    value: 0.09090909090909091
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19530001/Sch1-14-250&PiT=99991231235958
    as_at: 2026-09-29
    notes: 'TAA 1953 Sch 1 s14-250(6)(b): 1/11 of the contract price where the margin scheme does not apply.'
  bas_quarterly_due_day:
    value: 28
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/business-activity-statements-bas/due-dates-for-lodging-and-paying-your-bas
    as_at: 2026-09-29
    notes: 'Quarterly BAS due the 28th of the month after the quarter; quarter 2 (Oct-Dec) due 28 February. Weekend or public holiday rolls to the next business day. ATO page updated 17 Sep 2026.'
  bas_monthly_due_day:
    value: 21
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/business-activity-statements-bas/due-dates-for-lodging-and-paying-your-bas
    as_at: 2026-09-29
    notes: 'Monthly BAS due the 21st of the following month.'
  bas_annual_gst_return_due_day_october:
    value: 31
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/business-activity-statements-bas/due-dates-for-lodging-and-paying-your-bas
    as_at: 2026-09-29
    notes: 'Annual GST return due 31 October (28 February if no tax return is required).'
  bas_online_concession_days:
    value: 14
    unit: days
    status: VERIFIED
    source: https://www.ato.gov.au/online-services/businesses-and-organisations-online-services/lodgments-in-online-services-for-business/two-week-lodgment-concession-terms-and-conditions
    as_at: 2026-09-29
    notes: 'Extra 2 weeks to lodge AND pay quarterly BAS lodged online; quarters 1, 3 and 4 only; not monthly lodgers or large business clients (T&Cs updated 18 Aug 2025).'
  bas_monthly_december_concession_day_february:
    value: 21
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    notes: 'December monthly BAS due 21 February for business clients with up to $10m annual turnover who report GST monthly and lodge electronically; not deferred GST scheme members.'
  bas_agent_q1_due_yyyymmdd:
    value: null
    unit: date_yyyymmdd
    status: SUSPECT
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    notes: 'Quarter 1 2025-26 program date no longer shown on the ATO page; not verified.'
  bas_agent_q3_due_yyyymmdd:
    value: null
    unit: date_yyyymmdd
    status: SUSPECT
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    notes: 'Quarter 3 2025-26 program date no longer shown on the ATO page; not verified.'
  bas_agent_q4_due_yyyymmdd:
    value: 20260825
    unit: date_yyyymmdd
    status: VERIFIED
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    notes: 'Quarter 4 2025-26 (Apr-Jun 2026): lodge and pay by 25 Aug 2026 (page updated 1 Jul 2026).'
