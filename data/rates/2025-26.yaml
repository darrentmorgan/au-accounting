# Australian rates and thresholds, income year 2025-26. Machine-readable; read by every calculator.
# Statuses: VERIFIED = read on a primary page; SOURCE-CITED = stated with a primary cite, not re-read; SUSPECT = unknown, contradicted or secondary-only.
# Bracket objects: tax = base + rate x (income - from) for from <= income < to; to: null is open-ended. whole_income: true means the rate applies to the whole income base, not the excess.
# FBT figures are for the FBT year ending 31 Mar inside this income year (meta.fbt_year_ending).
