# gst overlay, income year 2027-28. Same schema as the base file; no key collisions; SUSPECT/null figures carry checked_at.
gst:
  simpler_bas_turnover_max:
    value: 10000000
    unit: AUD
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/lodging-your-bas-or-annual-gst-return/options-for-reporting-and-paying-gst/quarterly-gst-reporting
    as_at: 2026-09-29
    notes: 'GST turnover below this: Simpler BAS (G1, 1A, 1B only) unless on GST instalments; at or above: full reporting (G1, G2, G3, G10, G11, 1A, 1B).
      ATO page updated 14 Sep 2026. For 2027-28 (read 2026-09-29): Unchanged; no year-specific term or scheduled change found on the source.'
  registration_deadline_days:
    value: 21
    unit: days
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/registering-for-gst
    as_at: 2026-09-29
    notes: 'Register within 21 days of GST turnover reaching the threshold (ATO page updated 14 Sep 2026). For 2027-28 (read 2026-09-29): Unchanged; no
      year-specific term or scheduled change found on the source.'
  tax_invoice_buyer_identity_threshold:
    value: 1000
    unit: AUD
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/tax-invoices
    as_at: 2026-09-29
    notes: 'Tax invoices for taxable sales of $1,000 or more must also show the buyer identity or ABN (ATO page updated 18 Sep 2026; GST Regulations 2019
      reg 29-70.01). For 2027-28 (read 2026-09-29): Unchanged; no year-specific term or scheduled change found on the source.'
  financial_acquisitions_threshold_amount:
    value: 150000
    unit: AUD
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19990055/189-5&PiT=99991231235958
    as_at: 2026-09-29
    notes: 's189-5(1)(a): input tax credits on financial acquisitions over 12 months above this exceed the financial acquisitions threshold. For 2027-28
      (read 2026-09-29): Unchanged; no year-specific term or scheduled change found on the source.'
  financial_acquisitions_threshold_share:
    value: 0.1
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19990055/189-5&PiT=99991231235958
    as_at: 2026-09-29
    notes: 's189-5(1)(b): or more than 10% of total input tax credits for all acquisitions in the 12 months. For 2027-28 (read 2026-09-29): Unchanged; no
      year-specific term or scheduled change found on the source.'
  div87_value_share:
    value: 0.5
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19990055/87-5&PiT=99991231235958
    as_at: 2026-09-29
    notes: 's87-5(1): value of long-term commercial accommodation in premises predominantly for long-term accommodation is 50% of the price that would otherwise
      apply (GSTR 2012/7 para 28). For 2027-28 (read 2026-09-29): Unchanged; no year-specific term or scheduled change found on the source.'
  settlement_withholding_margin_scheme_rate:
    value: 0.07
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19530001/Sch1-14-250&PiT=99991231235958
    as_at: 2026-09-29
    notes: 'TAA 1953 Sch 1 s14-250(6)(a)(ii): 7% of the contract price where the margin scheme applies (no ministerial determination seen; ATO margin scheme
      example also uses 7%). For 2027-28 (read 2026-09-29): TAA 1953 Sch 1 s 14-250(6) still gives 7%; s 14-250(8) lets the Minister determine a higher
      percentage of up to 9% by legislative instrument, and none was found as at 2026-09-29 (ATO LCR 2018/4 also states 7%).'
  settlement_withholding_standard_fraction:
    value: 0.09090909090909091
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/print?DocID=PAC/19530001/Sch1-14-250&PiT=99991231235958
    as_at: 2026-09-29
    notes: 'TAA 1953 Sch 1 s14-250(6)(b): 1/11 of the contract price where the margin scheme does not apply. For 2027-28 (read 2026-09-29): Unchanged; no
      year-specific term or scheduled change found on the source.'
  bas_quarterly_due_day:
    value: 28
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/business-activity-statements-bas/due-dates-for-lodging-and-paying-your-bas
    as_at: 2026-09-29
    notes: 'Quarterly BAS due the 28th of the month after the quarter; quarter 2 (Oct-Dec) due 28 February. Weekend or public holiday rolls to the next
      business day. ATO page updated 17 Sep 2026. For 2027-28 (read 2026-09-29): Unchanged; no year-specific term or scheduled change found on the source.'
  bas_monthly_due_day:
    value: 21
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/business-activity-statements-bas/due-dates-for-lodging-and-paying-your-bas
    as_at: 2026-09-29
    notes: 'Monthly BAS due the 21st of the following month. For 2027-28 (read 2026-09-29): Unchanged; no year-specific term or scheduled change found on
      the source.'
  bas_annual_gst_return_due_day_october:
    value: 31
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/business-activity-statements-bas/due-dates-for-lodging-and-paying-your-bas
    as_at: 2026-09-29
    notes: 'Annual GST return due 31 October (28 February if no tax return is required). For 2027-28 (read 2026-09-29): Unchanged; no year-specific term
      or scheduled change found on the source.'
  bas_online_concession_days:
    value: 14
    unit: days
    status: VERIFIED
    source: https://www.ato.gov.au/online-services/businesses-and-organisations-online-services/lodgments-in-online-services-for-business/two-week-lodgment-concession-terms-and-conditions
    as_at: 2026-09-29
    notes: 'Extra 2 weeks to lodge AND pay quarterly BAS lodged online; quarters 1, 3 and 4 only; not monthly lodgers or large business clients (T&Cs updated
      18 Aug 2025). For 2027-28 (read 2026-09-29): Unchanged; no year-specific term or scheduled change found on the source.'
  bas_monthly_december_concession_day_february:
    value: 21
    unit: day_of_month
    status: VERIFIED
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    notes: 'December monthly BAS due 21 February for business clients with up to $10m annual turnover who report GST monthly and lodge electronically; not
      deferred GST scheme members. For 2027-28 (read 2026-09-29): ATO agent program page (updated 1 Jul 2026) states the 21 February December concession
      as a standing rule for eligible clients; confirm against the 2027-28 program when published.'
  bas_agent_q1_due_yyyymmdd:
    value: null
    unit: date_yyyymmdd
    status: SUSPECT
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    checked_at: 2026-09-29
    notes: 'Not published for 2027-28: the registered agent lodgment program 2027-28 is not developed yet (ATO activity statements page updated 1 Jul 2026:
      dates to be confirmed when it is developed).'
  bas_agent_q3_due_yyyymmdd:
    value: null
    unit: date_yyyymmdd
    status: SUSPECT
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    checked_at: 2026-09-29
    notes: 'Not published for 2027-28: the registered agent lodgment program 2027-28 is not developed yet (ATO activity statements page updated 1 Jul 2026:
      dates to be confirmed when it is developed).'
  bas_agent_q4_due_yyyymmdd:
    value: null
    unit: date_yyyymmdd
    status: SUSPECT
    source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/due-dates-by-obligation-type/activity-statements
    as_at: 2026-09-29
    checked_at: 2026-09-29
    notes: 'Not published for 2027-28: the registered agent lodgment program 2027-28 is not developed yet (ATO activity statements page updated 1 Jul 2026:
      dates to be confirmed when it is developed).'
