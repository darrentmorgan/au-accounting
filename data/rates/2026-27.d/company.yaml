    - {from: 2021-07-01, to: 2022-06-30, rate: 0.0452}
    - {from: 2022-07-01, to: 2023-06-30, rate: 0.0477}
    - {from: 2023-07-01, to: 2024-06-30, rate: 0.0827}
    - {from: 2024-07-01, to: 2025-06-30, rate: 0.0877}
    - {from: 2025-07-01, to: 2026-06-30, rate: 0.0837}
    - {from: 2026-07-01, to: 2027-06-30, rate: 0.0877}
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/tax-rates-and-codes/division-7a-benchmark-interest-rate
    as_at: 2026-09-29
    notes: 'ATO table, income years ended 30 June 2022 to 2027 (ITAA 1936 s109N(2)). Standard 1 Jul - 30 Jun years only; substituted accounting periods use a different RBA rate.'
