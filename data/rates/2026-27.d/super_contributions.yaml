    value: 10
    unit: AUD
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A01195/2018-07-01/2018-07-01/text/original/epub/OEBPS/document_1/document_1.html
    as_at: 2026-09-29
    notes: 'Co-contribution Act s12E(2)(c): LISTO below $10 is increased to $10.'
  spouse_offset_rate:
    value: 0.18
    unit: rate
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
