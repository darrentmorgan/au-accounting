    as_at: 2026-09-29
    notes: 'ITAA 1997 s292-85(3)(c): bring forward available only if under 75 at any time in the first year.'
  co_contribution_match_rate:
    value: 0.5
    unit: rate
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A01195/2018-07-01/2018-07-01/text/original/epub/OEBPS/document_1/document_1.html
    as_at: 2026-09-29
    notes: 'Superannuation (Government Co-contribution for Low Income Earners) Act 2003 s9(1)(d): 50% of eligible personal contributions, 2012-13 and later.'
  co_contribution_taper_per_dollar:
    value: 0.03333
    unit: rate
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A01195/2018-07-01/2018-07-01/text/original/epub/OEBPS/document_1/document_1.html
    as_at: 2026-09-29
    notes: 'Co-contribution Act s10(1C): maximum reduced by 3.333 cents per dollar of total income above the lower income threshold.'
  co_contribution_minimum:
    value: 20
    unit: AUD
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A01195/2018-07-01/2018-07-01/text/original/epub/OEBPS/document_1/document_1.html
    as_at: 2026-09-29
    notes: 'Co-contribution Act s11: an entitlement below $20 is increased to $20.'
  co_contribution_eligible_income_ratio:
    value: 0.1
    unit: ratio
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A01195/2018-07-01/2018-07-01/text/original/epub/OEBPS/document_1/document_1.html
    as_at: 2026-09-29
    notes: 'Co-contribution Act s6(1)(b): at least 10% of total income from employment-type activities or carrying on a business (business deductions not subtracted for this test, s8(3)).'
  co_contribution_age_limit:
    value: 71
    unit: years
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A01195/2018-07-01/2018-07-01/text/original/epub/OEBPS/document_1/document_1.html
    as_at: 2026-09-29
    notes: 'Co-contribution Act s6(1)(e): less than 71 years old at the end of the income year.'
  listo_rate:
    value: 0.15
    unit: rate
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A01195/2018-07-01/2018-07-01/text/original/epub/OEBPS/document_1/document_1.html
    as_at: 2026-09-29
    notes: 'Co-contribution Act s12E(2)(a): LISTO = 15% of concessional contributions, capped at the maximum and at least $10 (s12E(2)(b)-(c)). Schedule 4 of Act No. 8 of 2026 changes the threshold and maximum from 1 Jul 2027 only.'
