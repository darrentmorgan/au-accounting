    as_at: 2026-09-29
    notes: 'ITAA 1997 s290-235(1)(a): reduction starts once spouse income (assessable income + RFB + RESC, s290-230(2)(c)) exceeds $37,000.'
  spouse_offset_income_cutout:
    value: 40000
    unit: AUD
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
    notes: 'ITAA 1997 s290-230(2)(c): spouse income must be less than $40,000.'
  spouse_offset_max:
    value: 540
    unit: AUD
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
    notes: 'ITAA 1997 s290-235(2): maximum offset per income year $540, even for more than one spouse.'
  downsizer_cap:
    value: 300000
    unit: AUD
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
    notes: 'ITAA 1997 s292-102(3)(a): $300,000 per person less earlier downsizer contributions; also limited to capital proceeds (s292-102(3)(b)). Not indexed.'
  downsizer_min_age:
    value: 55
    unit: years
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
    notes: 'ITAA 1997 s292-102(1)(a): contribution made when aged 55 or over.'
  downsizer_ownership_years:
    value: 10
    unit: years
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
    notes: 'ITAA 1997 s292-102(2): dwelling or land held by the person, spouse or former spouse for the 10 years ending just before the disposal.'
  downsizer_contribution_days:
    value: 90
    unit: days
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
    notes: 'ITAA 1997 s292-102(1)(g): contribution within 90 days after change of ownership, or longer period the Commissioner allows.'
