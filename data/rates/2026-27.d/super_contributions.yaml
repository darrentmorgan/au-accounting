    value: 0.15
    unit: rate
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
    notes: 'ITAA 1997 s291-15(b): non-refundable tax offset equal to 15% of excess concessional contributions, which are included in assessable income (s291-15(a)).'
  excess_concessional_release_divisor:
    value: 0.85
    unit: rate
    status: VERIFIED
    source: https://www.legislation.gov.au/C2004A05138/2026-08-27/2026-08-27/text/original/epub/OEBPS/document_6/document_6.html
    as_at: 2026-09-29
