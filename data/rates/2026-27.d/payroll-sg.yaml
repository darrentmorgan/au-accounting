super:
  payday_super_usual_period_business_days:
    value: 7
    unit: business_days
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/super-for-employers/paying-super-on-payday/payment-deadlines-for-payday-super
    as_at: *id001
    notes: 'SGAA as amended by Treasury Laws Amendment (Payday Superannuation) Act 2025: contribution must be received by
      the fund (allocable) within 7 business days after the QE day. Business day excludes Sat, Sun and a public holiday for
      the whole of any state, the ACT or the NT (LCR 2026/3 para 4).'
  payday_super_first_contribution_business_days:
    value: 20
    unit: business_days
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/super-for-employers/paying-super-on-payday/payment-deadlines-for-payday-super
    as_at: *id001
    notes: 'Allowable longer period: first contribution for a new employee, or to a new fund for an existing employee: 20
      business days after the QE day.'
  sgc_admin_uplift_default_rate:
    value: 0.6
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: 'SGAA s19B(1): administrative uplift = 60% of (individual final SG shortfalls + notional earnings) for the QE day.'
  sgc_admin_uplift_compliance_history_reduction:
    value: 0.2
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: 'SG Regs 2018 s13C: 20 percentage points off if no Commissioner-initiated SGC assessment or estimate in the 24
      months ending on the QE day (pre-1 Jul 2026 charges ignored).'
  sgc_admin_uplift_vds_reduction_30_days:
    value: 0.4
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: 'SG Regs 2018 s13D: voluntary disclosure statement lodged before the end of 30 calendar days starting on the QE
      day.'
  sgc_admin_uplift_vds_reduction_60_days:
    value: 0.35
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: Voluntary disclosure lodged 31 to 60 calendar days starting on the QE day.
  sgc_admin_uplift_vds_reduction_120_days:
    value: 0.3
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: Voluntary disclosure lodged 61 to 120 calendar days starting on the QE day.
  sgc_admin_uplift_vds_reduction_later:
    value: 0.15
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: Voluntary disclosure lodged more than 120 calendar days starting on the QE day (but before assessment).
  sgc_choice_loading_rate:
    value: 0.25
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: 'SGAA s20A(1)(a): 25% of contributions that did not comply with choice of fund rules.'
  sgc_choice_loading_limit:
    value: 1200
    unit: AUD
    status: VERIFIED
    source: https://www.ato.gov.au/law/view/document?docid=COG/LCR20263/NAT/ATO/00001
    as_at: *id001
    notes: 'SGAA s20C: limit per employee per notice period, reduced by prior choice loadings in the notice period.'
  sgc_late_payment_penalty_rate_first:
    value: 0.25
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/super-for-employers/payday-super/about-payday-super
    as_at: *id001
    notes: Penalty for unpaid SGC from 1 Jul 2026 is 25% or 50% depending on prior penalties. Not computed by the calculator.
  sgc_late_payment_penalty_rate_repeat:
    value: 0.5
    unit: rate
    status: VERIFIED
    source: https://www.ato.gov.au/businesses-and-organisations/super-for-employers/payday-super/about-payday-super
    as_at: *id001
    notes: See sgc_late_payment_penalty_rate_first.
