# Australian public holidays, 1 Jul 2025 to 30 Jun 2028 (FY2025-26 to FY2027-28). Machine-readable; read by due-date calculators.
# Purpose: decide which days are NOT business days when a tax due date is rolled forward. Rules and citations: docs/research/due-dates-public-holidays.md
# Scope: a public holiday declared for the WHOLE of a State or Territory (statewide or territory-wide). Excluded: regional or local days (Royal Hobart Regatta and
#   Show, Recreation Day (TAS), Royal Queensland Show (Brisbane only), NT show days, local event days), bank-only holidays (NSW and ACT first Monday in August),
#   and Tasmanian Public Service-only days (Easter Tuesday, Launceston Cup, Devonport Cup).
# Entry: one row per (date, name, jurisdictions). jurisdictions is ALL (every State and Territory) or a sorted list of ACT NSW NT QLD SA TAS VIC WA.
#   part_day: true marks a holiday that applies only from part_day_from (local time) on that date; absent means a whole-day holiday.
#   weekday is a transcription check (the validator recomputes it). Substitute and additional days are separate rows with the name the State uses.
# Status: VERIFIED = date read on a primary government page or fixed by the cited statute; SUSPECT = not yet declared or a law change is pending (see unresolved).
# Public holidays can still be added or substituted by proclamation or ministerial order; re-check every July (annual update runbook, GOAL.md gate 7).
meta:
  schema_version: 1
  range_start: 2025-07-01
  range_end: 2028-06-30
  compiled: 2026-09-29
  income_years: [2025-26, 2026-27, 2027-28]
  jurisdictions: [ACT, NSW, NT, QLD, SA, TAS, VIC, WA]
regimes:
  commonwealth_tax:
    applies_to: ATO-administered obligations (BAS, PAYG, FBT, income tax lodgment and payment, Payday Super business days)
    non_business_day: Saturday, Sunday, or a day that is a public holiday for the whole of any State, the ACT or the NT; the taxpayer's own location is irrelevant
    jurisdictions: ALL
    part_day_holidays_count: true
    part_day_basis: The ATO table lists Christmas Eve (QLD, NT, SA) and New Year's Eve (NT, SA) as non-business days. The statutory wording is ambiguous on part-day holidays; follow the ATO table.
    rule_source: https://www.legislation.gov.au/C1953A00001/latest/text
    table_source: https://www.ato.gov.au/tax-and-super-professionals/for-tax-professionals/prepare-and-lodge/registered-agent-lodgment-program/lodgment-and-payment-dates-on-weekends-or-public-holidays
  sa_state_tax:
    applies_to: RevenueSA-administered obligations (payroll tax returns and payment, land tax, other SA state taxes)
    non_business_day: Saturday, Sunday, or a public holiday under the Public Holidays Act 2023 (SA); other States' holidays are irrelevant
    jurisdictions: [SA]
    part_day_holidays_count: false
    part_day_basis: Legislation Interpretation Act 2021 (SA) s 46 and Public Holidays Act 2023 (SA) s 8(3) exclude part-day public holidays (Christmas Eve and New Year's Eve, 7pm to midnight).
    rule_source: https://www.legislation.sa.gov.au/lz?path=/c/a/legislation%20interpretation%20act%202021
    table_source: https://www.revenuesa.sa.gov.au/payrolltax/returns-and-annual-reconciliation/monthly-returns
